<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Свято-Пантелеимонов монастырь — экран архондарика</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a1411">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231f5c46'/%3E%3Cpath d='M29 8h6v10h12v6H35v32h-6V24H17v-6h12z' fill='%23f3efe4'/%3E%3Cpath d='M21 36h22v5H21z' fill='%23f3efe4'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #0a1411; overflow: hidden; }
  iframe { display: block; border: 0; width: 100%; height: 100vh; height: 100dvh; }
</style>
</head>
<body>
<iframe id="site" title="Экран архондарика" allow="autoplay; fullscreen; screen-wake-lock"></iframe>
<script>
  /* Экран для архондарика: тот же сайт обители, но сразу страница-табло (параметр tv=1) — часы, распорядок,
     колокол за 30 минут до службы, погода, изречения. Пока сайт закрыт, ключ k берётся из памяти браузера
     (его запоминает stpanteleimon.gr/?k=КЛЮЧ) или из ссылки stpanteleimon.gr/tv/?k=КЛЮЧ.
     Фон можно выбрать: stpanteleimon.gr/tv/?bg=49 — номер снимка в разделе «Фото».
     Вариант со сменой снимков слева вверху: stpanteleimon.gr/tv/?foto=1. */
  (function () {
    var SITE = "https://script.google.com/macros/s/AKfycbw8GeiHe-gKmS68FWwlqcJmy8rU77qDIHDe_XTDARqmdjhct2NqODonH3mpOKLEUhL4/exec";
    var q = new URLSearchParams(location.search);
    var k = q.get("k") || "", bg = q.get("bg") || "", foto = q.get("foto") === "1";
    try { if (k) localStorage.setItem("k", k); else k = localStorage.getItem("k") || ""; } catch (e) { /* без памяти */ }
    document.getElementById("site").src = SITE + "?w=1&tv=1" + (k ? "&k=" + encodeURIComponent(k) : "") +
      (/^[0-9a-z]{1,8}$/.test(bg) ? "&bg=" + bg : "") + (foto ? "&foto=1" : "");
    if (q.has("k")) { try { q.delete("k"); var r = q.toString(); history.replaceState(null, "", location.pathname + (r ? "?" + r : "")); } catch (e) { /* ignore */ } }
  })();
</script>
</body>
</html>
