<script>
  /* Сайт обители работает на Google Apps Script; здесь он показан на весь экран под адресом stpanteleimon.gr.

  (function () {

    var q = new URLSearchParams(location.search);
    var k = q.get("k") || "", gt = q.get("gt") || "";
    try { if (k) localStorage.setItem("k", k); else k = localStorage.getItem("k") || ""; } catch (e) { /* без памяти */ }
    document.getElementById("site").src = SITE + "?w=1" + (k ? "&k=" + encodeURIComponent(k) : "") +

    if (q.has("k") || q.has("gt")) { try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) { /* ignore */ } }
  })();
